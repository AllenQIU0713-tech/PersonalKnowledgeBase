<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>个人知识库</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><div class="brand">个人知识库<small>留在本机的资料柜</small></div><nav aria-label="主要入口"><button data-view="collect" class="active">收集</button><button data-view="find">查找与提问</button><button data-view="memory">我的记忆</button></nav><div class="local">本机保存<span id="storage"></span></div></aside><main><header><div><p class="eyebrow">PERSONAL ARCHIVE</p><h1 id="heading">把值得记住的留下来</h1></div><span class="badge">本地知识库</span></header><p id="notice" role="status" aria-live="polite"></p>
<section id="collect" class="view"><div class="sheet"><h2>添加资料</h2><form id="collect-form"><label>标题<input id="title" maxlength="300" required placeholder="这份资料叫什么？"></label><label>文字<textarea id="text" rows="8" placeholder="粘贴一段文字，或在这里粘贴剪贴板图片"></textarea></label><div id="drop" tabindex="0">拖入文件，或<label class="inline">选择文件<input id="file" type="file"></label><small>每个文件最多 25 MiB；一次选择一份，依次收集</small><p id="filename"></p></div><div class="fields"><label>标签<input id="tags" placeholder="用逗号分隔"></label><label>事件日期（可选）<input id="event-time" type="date"></label><label>隐私<select id="privacy"><option value="allowed">提问时允许发送相关片段</option><option value="local">禁止外发，仅本地查找</option></select></label></div><button class="primary" type="submit">保存到本机</button></form></div><p class="hint">原件保留在本机。保存资料不会自动调用云端模型。</p></section>
<section id="find" class="view" hidden><form id="search-form" class="searchbar"><label class="grow">查找历史<input id="query" placeholder="输入原句、标题或关键词"></label><label>标签<input id="filter-tag"></label><label>起始日期<input id="since" type="date"></label><label>结束日期<input id="until" type="date"></label><button class="primary">查找</button></form><p id="search-mode" class="hint">关键词检索已提供；语义检索尚未启用。</p><div class="workspace"><div id="results"></div><article id="detail" class="sheet"><h2>选择一份资料</h2><p>在这里查看原文、来源与隐私设置。</p></article></div><div class="sheet" id="answer-panel"><h2>基于资料提问</h2><p class="hint">真实云端服务尚未配置。可先查看资料范围或使用离线模拟流程；不会发送网络请求。</p><label>你的问题<textarea id="question" rows="3"></textarea></label><div class="actions"><button id="preview-answer">查看可用片段</button><button id="mock-answer">离线模拟回答</button><button id="answer-history">查看问答记录</button><button id="outbound-history">查看外发记录</button></div><div id="answer-result"></div></div></section>
<section id="memory" class="view" hidden><div class="sheet"><h2>我的记忆</h2><p>个人记忆将在后续批次交付，推测出的记忆需要你确认后才会参与回答。</p></div></section>
</main><script src="/app.js"></script></body></html>
